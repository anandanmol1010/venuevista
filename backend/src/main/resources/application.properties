# VenueVista Application Configuration

spring.application.name=VenueVista

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/venuevista?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:VenueVistaSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong2024}
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200
